<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEEP WORK TERMINAL</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="bg-image" id="bg-night"></div>
<div class="bg-image" id="bg-day"></div>
<div class="bg-image" id="bg-red"></div>
<div class="bg-image" id="bg-green"></div>
<div class="bg-image" id="bg-orange"></div>
<div class="bg-image" id="bg-indigo"></div>
<div class="bg-image" id="bg-violet"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="dial-wrapper">
  <div class="dial-container" id="dial-container" role="slider" tabindex="0" aria-label="Color theme" aria-valuemin="0" aria-valuemax="6" aria-valuenow="2" aria-valuetext="Yellow">
    <svg viewBox="0 0 160 160" width="100%" height="100%" id="dial-svg">
      <defs>
        <radialGradient id="housingGrad" cx="50%" cy="45%">
          <stop offset="0%" stop-color="#3a3832"/>
          <stop offset="60%" stop-color="#2a2825"/>
          <stop offset="100%" stop-color="#1a1918"/>
        </radialGradient>
        <radialGradient id="axleGrad" cx="45%" cy="40%">
          <stop offset="0%" stop-color="#555350"/>
          <stop offset="100%" stop-color="#2a2928"/>
        </radialGradient>
      </defs>
      <circle cx="80" cy="80" r="78" fill="#151413" stroke="#333230" stroke-width="2"/>
      <circle cx="80" cy="80" r="74" fill="url(#housingGrad)" stroke="#2a2826" stroke-width="1"/>
      <circle cx="80" cy="80" r="70" fill="none" stroke="#222120" stroke-width="0.5"/>
      <g id="dial-ticks"></g>
      <g id="dial-dots"></g>
      <g id="cog-group">
        <g id="cog-teeth"></g>
        <circle id="cog-body" cx="80" cy="80" r="30" fill="#3a3015" stroke="#8a702a" stroke-width="1.5"/>
        <circle cx="80" cy="80" r="27" fill="none" stroke="#3a3835" stroke-width="0.5"/>
        <circle cx="80" cy="80" r="22" fill="none" stroke="#333130" stroke-width="0.5" stroke-dasharray="2 3"/>
        <g id="knurl-lines"></g>
      </g>
      <circle cx="80" cy="80" r="10" fill="url(#axleGrad)" stroke="#4a4845" stroke-width="1.5"/>
      <circle cx="80" cy="80" r="7" fill="none" stroke="#3a3835" stroke-width="0.5"/>
      <line id="dial-indicator" x1="80" y1="80" x2="80" y2="50" stroke="#f0c850" stroke-width="2.5" stroke-linecap="round"/>
      <circle id="dial-indicator-dot" cx="80" cy="50" r="2.5" fill="#f0c850"/>
      <circle id="dial-axle-center" cx="80" cy="80" r="3" fill="#5a4a1e" stroke="#8a702a" stroke-width="0.5"/>
      <g>
        <circle cx="16" cy="16" r="3" fill="#2a2826" stroke="#3a3835" stroke-width="0.5"/>
        <circle cx="144" cy="16" r="3" fill="#2a2826" stroke="#3a3835" stroke-width="0.5"/>
        <circle cx="16" cy="144" r="3" fill="#2a2826" stroke="#3a3835" stroke-width="0.5"/>
        <circle cx="144" cy="144" r="3" fill="#2a2826" stroke="#3a3835" stroke-width="0.5"/>
        <circle cx="16" cy="16" r="1.5" fill="#222120"/>
        <circle cx="144" cy="16" r="1.5" fill="#222120"/>
        <circle cx="16" cy="144" r="1.5" fill="#222120"/>
        <circle cx="144" cy="144" r="1.5" fill="#222120"/>
      </g>
      <circle cx="80" cy="80" r="78" fill="none" stroke="#444240" stroke-width="0.3"/>
    </svg>
  </div>
  <div class="dial-label" id="dial-label">Yellow</div>
</div>

<div class="app-container" id="app"></div>

<!-- Snack popup — outside app, never touched by render() -->
<div id="snack-layer">
  <div class="snack-popup">
    <h2>EXERCISE SNACK!</h2>
    <canvas id="snack-sprite" class="snack-sprite" width="144" height="153" data-src="./assets/snack-sprite.png" role="img" aria-label="Pixel-art bodybuilder flexing"></canvas>
    <div class="snack-shout">YEAH BUDDY!</div>
    <div class="subtext">LIGHT WEIGHT!</div>
    <div class="snack-countdown">Auto-dismiss in a few seconds...</div>
  </div>
</div>

<script src="./js/dial.js" defer></script>
<script src="./js/snack-sprite.js" defer></script>
<script src="./js/audio.js" defer></script>
<script src="./js/timer.js" defer></script>
<script src="./js/app.js" defer></script>

<!-- Buy me a coffee -->
<a class="coffee-btn" href="https://buymeacoffee.com/gregoryrichens" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
  Buy me a coffee
</a>

</body>
</html>
